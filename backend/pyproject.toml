[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "superstep-backend"
version = "0.8.0"
license = "MIT"
description = "FastAPI backend for Superstep (compiler, runner, auth, repo import)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "langgraph",
  "httpx",
  "pyjwt",
  "python-multipart",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "cryptography",
  "psycopg[binary]>=3.2",  # Postgres driver (DATABASE_URL=postgresql://...), TASK-0009
  "redis>=5",              # optional run bus (REDIS_URL), TASK-0009
  "fakeredis>=2.20",       # Redis contract tests without a server
  "pypdf>=4",              # PDF text for knowledge bases (TASK-0012)
  "aiosmtpd>=1.4",         # local SMTP debug server for notification e-mail tests (TASK-0020)
  "opentelemetry-sdk>=1.27",                      # run traces (TASK-0010); no-op without an exporter
  "opentelemetry-exporter-otlp-proto-http>=1.27", # OTLP/HTTP exporter (also used for LangSmith)
  "langchain-openai>=1.0", # LM Studio / OpenRouter / OpenAI-compatible chat models (TASK-0030)
  "openai>=2.45,<3",       # 3.x switched to httpx2 (respx cannot mock it), DEC-0032
  "langchain-ollama>=1.0", # Ollama chat models (TASK-0030)
  "respx>=0.21",           # mocked provider HTTP in tests
  "mcp>=1.12,<2",          # MCP server for workflows at /mcp (TASK-0114)
  "pytest-cov",
  "pytest",  # test runner kept in base deps so `factory deps apply` (pip install -e .) can run verification
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["imports", "fixtures", ".venv"]
