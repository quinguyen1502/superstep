&lt;script&gt;
(() =&gt; {

  function renderRecipe(){
    const items=[

    q(&#x27;#bw-recipe-value&#x27;).addEventListener(&#x27;input&#x27;,e=&gt;{
      const key=[&#x27;&#x27;,&#x27;fillSelector&#x27;,&#x27;clickSelector&#x27;,&#x27;extractSelector&#x27;][state.recipeStep];

  }
  function finishStep(title,status,message,more={}){return {tool:&#x27;workflow&#x27;,title,detail:message,page:&#x27;stopped&#x27;,result:{status,message,...more},done:true};}
  function ask(message){return finishStep(state.missing===&#x27;ask&#x27;?&#x27;Ask the user&#x27;:&#x27;Missing information&#x27;,state.missing===&#x27;ask&#x27;?&#x27;needs_input&#x27;:&#x27;missing_input&#x27;,message);}
  function targetCheck(raw,withBrowser){
    let u;
    try{u=new URL(raw);}catch{return [&#x27;invalid_url&#x27;,&#x27;The URL is not valid.&#x27;];}
    if(![&#x27;http:&#x27;,&#x27;https:&#x27;].includes(u.protocol)||u.username||u.password)return [&#x27;invalid_url&#x27;,&#x27;Needs an HTTP/HTTPS URL without credentials.&#x27;];

    }

  function buildPlan(){
    const plan=[];
    const order=(state.message.match(/\bSS-\d+\b/i)||[])[0]||&#x27;&#x27;;
    const extracted=(state.message.match(/https?:\/\/[^\s&lt;&gt;&quot;&#x27;)]+/i)||[])[0]?.replace(/[.,;!?]+$/,&#x27;&#x27;)||&#x27;&#x27;;
    const recipe=state.runKind===&#x27;recipe&#x27;;

    const challenge=state.scenario===&#x27;challenge&#x27;;
    plan.push(action(&#x27;browser_navigate&#x27;,&#x27;Open the URL at run time&#x27;,url,challenge?&#x27;challenge&#x27;:changed?&#x27;menu&#x27;:&#x27;lookup&#x27;));

    }

            width,
            viewportHeight: globalThis.innerHeight,

            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),

  }

      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");

        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&

    }
