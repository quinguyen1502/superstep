# OpenTelemetry Collector for `docker compose --profile observability`.
# The backend pushes OTLP (traces and, with STUDIO_OTEL_METRICS=1, metrics) here. The collector also reads Postgres and
# Redis server metrics itself (postgresql, sqlquery and redis receivers), so Prometheus keeps one target: this collector.
# Metrics are exposed for Prometheus on :8889 and traces are forwarded to Jaeger.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
  # Postgres server metrics with the read-only monitoring role (pg_monitor) that the `postgres-monitor` service creates.
  # No metrics until POSTGRES_MONITOR_PASSWORD is set; the collector keeps retrying and logs the failed login.
  postgresql:
    endpoint: ${env:POSTGRES_MONITOR_ENDPOINT}
    transport: tcp
    username: ${env:POSTGRES_MONITOR_USER}
    password: ${env:POSTGRES_MONITOR_PASSWORD}
    databases: ["${env:POSTGRES_DB}"]
    collection_interval: 15s
    tls: { insecure: true }
    metrics:
      postgresql.deadlocks: { enabled: true }
  # What the postgresql receiver does not report: client connections by state (active, idle, idle in transaction) and
  # the database's buffer cache hits and reads (cache hit ratio).
  sqlquery/postgres:
    driver: postgres
    datasource: "host=${env:POSTGRES_MONITOR_HOST} port=${env:POSTGRES_MONITOR_PORT} user=${env:POSTGRES_MONITOR_USER} password=${env:POSTGRES_MONITOR_PASSWORD} dbname=${env:POSTGRES_DB} sslmode=disable"
    collection_interval: 15s
    queries:
      - sql: "SELECT coalesce(state, 'unknown') AS state, count(*) AS connections FROM pg_stat_activity WHERE backend_type = 'client backend' GROUP BY 1"
        metrics:
          - metric_name: postgresql.activity.connections
            value_column: connections
            attribute_columns: [state]
            data_type: gauge
            value_type: int
      - sql: "SELECT blks_hit, blks_read FROM pg_stat_database WHERE datname = current_database()"
        metrics:
          - metric_name: postgresql.cache.hits
            value_column: blks_hit
            data_type: sum
            monotonic: true
            value_type: int
          - metric_name: postgresql.cache.reads
            value_column: blks_read
            data_type: sum
            monotonic: true
            value_type: int
  # Redis server metrics (INFO). Without a reachable Redis the panels stay empty.
  redis:
    endpoint: ${env:REDIS_MONITOR_ENDPOINT}
    collection_interval: 15s
    metrics:
      redis.maxmemory: { enabled: true }

processors:
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Keep the OTel names (dots become underscores) without unit or _total suffixes; the dashboard and alert rules rely on it.
    add_metric_suffixes: false
    # Series of a stopped process disappear after this long.
    metric_expiration: 5m
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp, postgresql, sqlquery/postgres, redis]
      processors: [batch]
      exporters: [prometheus]
