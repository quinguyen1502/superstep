# Prometheus for `docker compose --profile observability`: scrapes the collector, not the backend.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    # Keep the job and instance labels the collector sets from each process (service.name, service.instance.id).
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
