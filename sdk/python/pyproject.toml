[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "superstep"
dynamic = ["version"]
description = "Python client for the Superstep public API: start workflow runs and read their results."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Qui Nguyen" }]
dependencies = ["httpx>=0.25,<1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
  "Framework :: AsyncIO",
]

[project.optional-dependencies]
# Phase 1 adds no third-party package. The extra is the install path (`pip install superstep[cli]`);
# phase 2 puts the MCP SDK here. The console script cannot be gated on an extra, so it ships with the base package.
cli = []
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# `factory deps apply` installs `.[test]`, so verification has pytest without it in base deps.
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
superstep = "superstep.cli:main"

[project.urls]
Homepage = "https://github.com/quinguyen1502/superstep"
Documentation = "https://quinguyen1502.github.io/superstep/run/public-api/"

[tool.hatch.version]
path = "src/superstep/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/superstep"]

[tool.hatch.build.targets.wheel.force-include]
"src/superstep/cli/locales/en.json" = "superstep/cli/locales/en.json"
"src/superstep/cli/locales/vi.json" = "superstep/cli/locales/vi.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
