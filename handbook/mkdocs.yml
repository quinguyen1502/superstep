# English site, at the root. mkdocs.vi.yml builds the Vietnamese one into site/vi/.
#   zensical build && zensical build -f mkdocs.vi.yml
INHERIT: mkdocs.base.yml

site_description: Design, run and operate LangGraph workflows in the browser
site_url: https://quinguyen1502.github.io/superstep/
edit_uri: edit/develop/handbook/docs/en/
docs_dir: docs/en
site_dir: site

theme:
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
