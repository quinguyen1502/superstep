# All-in-one image (root Dockerfile): build, smoke test on SQLite and on Postgres, CLI smoke, Trivy scan, then publish
# to GHCR on develop and on release tags (vX.Y.Z). The same tag rules publish superstep-api (backend/Dockerfile) and
# superstep-web (frontend/Dockerfile). Pull requests do not push. Only GITHUB_TOKEN is used.
name: Image

on:
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag in main to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: image-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

env:
  SMOKE_EMAIL: ci-admin@example.com
  SMOKE_PASSWORD: Ci-smoke-pass-1

jobs:
  source:
    name: Resolve image source
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        name: Bind release tag to an integrated source commit
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: python
        run: |
          import json, os, pathlib, re, subprocess, tomllib
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          sha = git("rev-parse", "HEAD")
          tag = os.environ["GITHUB_REF_NAME"] if os.environ["GITHUB_REF_TYPE"] == "tag" else ""
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              tag = os.environ["INPUT_RELEASE_TAG"]
              if not re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag):
                  raise SystemExit("Expected an existing stable vX.Y.Z release tag")
              sha = git("rev-parse", f"refs/tags/{tag}^{{commit}}")
              subprocess.run(["git", "merge-base", "--is-ancestor", sha, "origin/main"], check=True)
              backend = tomllib.loads(git("show", f"{sha}:backend/pyproject.toml"))["project"]["version"]
              python = re.search(r'__version__\s*=\s*[\'"]([^\'"]+)', git("show", f"{sha}:sdk/python/src/superstep/_version.py")).group(1)
              frontend = json.loads(git("show", f"{sha}:frontend/package.json"))["version"]
              if not backend == python == frontend == tag[1:]:
                  raise SystemExit("Release tag and shared package versions must agree")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"sha={sha}\ntag={tag}\n")

  test:
    name: All-in-one image (build + SQLite/Postgres smoke + Trivy)
    needs: source
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: studio, POSTGRES_PASSWORD: studio, POSTGRES_DB: studio }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U studio" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - name: Deploy files (Render, Heroku, Railway, Fly, DO, Zeabur, compose)
        run: pip install pyyaml && python scripts/check_deploy_configs.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: superstep:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the sandbox service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/studio-sandbox/Dockerfile
          load: true
          tags: superstep-sandbox:ci
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
      - run: pip install httpx websockets
      - name: Smoke on SQLite (volume, production mode, admin from env)
        run: |
          docker run -d --name sq -p 8000:8000 -v sqdata:/data -e JWT_SECRET=ci-jwt-$GITHUB_RUN_ID-0123456789abcdef \
            -e STUDIO_SECRET_KEY=ci-key-$GITHUB_RUN_ID -e STUDIO_ADMIN_EMAILS=$SMOKE_EMAIL -e STUDIO_ADMIN_PASSWORD=$SMOKE_PASSWORD superstep:ci
          scripts/image_smoke.sh http://localhost:8000 sq
          docker restart sq && scripts/image_smoke.sh http://localhost:8000 sq   # data and sign-in survive a restart
          docker exec sq deno --version && docker exec sq sh -c 'test -w /data && ls /data'
      - name: Smoke on Postgres (postgres:// URL, generated admin password)
        run: |
          docker run -d --name pg --network host -e PORT=8001 -e DATABASE_URL=postgres://studio:studio@localhost:5432/studio \
            -e JWT_SECRET=ci-jwt-$GITHUB_RUN_ID-0123456789abcdef -e STUDIO_SECRET_KEY=ci-key-$GITHUB_RUN_ID -e STUDIO_ADMIN_EMAILS=$SMOKE_EMAIL superstep:ci
          until curl -fsS http://localhost:8001/api/health >/dev/null 2>&1; do sleep 1; done
          pw=$(docker logs pg 2>&1 | sed -n 's/.*change it now): \([^ ]*\).*/\1/p' | head -1)
          test -n "$pw" && SMOKE_PASSWORD=$pw scripts/image_smoke.sh http://localhost:8001 pg
      - name: Root-owned volume (Fly, Railway, Render, Zeabur mounts) and a platform PORT
        run: |
          sudo mkdir -p "$RUNNER_TEMP/rootdata" && sudo chown root:root "$RUNNER_TEMP/rootdata" && sudo chmod 755 "$RUNNER_TEMP/rootdata"
          docker run -d --name rv -p 8080:8080 -e PORT=8080 -v "$RUNNER_TEMP/rootdata:/data" \
            -e JWT_SECRET=ci-jwt-$GITHUB_RUN_ID-0123456789abcdef -e STUDIO_SECRET_KEY=ci-key-$GITHUB_RUN_ID \
            -e STUDIO_ADMIN_EMAILS=$SMOKE_EMAIL -e STUDIO_ADMIN_PASSWORD=$SMOKE_PASSWORD superstep:ci
          scripts/image_smoke.sh http://localhost:8080 rv
          test "$(docker top rv -o pid,uid,args | awk '/uvicorn/ {print $2; exit}')" = 10001 || { docker top rv -o pid,uid,args; exit 1; }  # dropped root
          sudo test -f "$RUNNER_TEMP/rootdata/studio.db"
      - name: Remote sandbox (internal network, hardened container, Python + TypeScript, no network)
        run: |
          docker network create --internal sbx && docker network create front
          docker run -d --name sbx --network sbx --read-only --tmpfs /tmp:size=256m --cap-drop ALL \
            --cap-add SETUID --cap-add SETGID --cap-add CHOWN --cap-add KILL --cap-add DAC_OVERRIDE --cap-add FOWNER \
            --security-opt no-new-privileges:true -e STUDIO_SANDBOX_TOKEN=ci-sandbox-token-$GITHUB_RUN_ID superstep-sandbox:ci
          docker create --name rm --network front -p 8090:8000 -e STUDIO_CODE_RUNTIME=remote -e STUDIO_SANDBOX_URL=sbx:8080 \
            -e STUDIO_SANDBOX_TOKEN=ci-sandbox-token-$GITHUB_RUN_ID -e JWT_SECRET=ci-jwt-$GITHUB_RUN_ID-0123456789abcdef \
            -e STUDIO_SECRET_KEY=ci-key-$GITHUB_RUN_ID -e STUDIO_ADMIN_EMAILS=$SMOKE_EMAIL -e STUDIO_ADMIN_PASSWORD=$SMOKE_PASSWORD superstep:ci
          docker network connect sbx rm && docker start rm
          scripts/image_smoke.sh http://localhost:8090 rm
          python scripts/sandbox_smoke.py http://localhost:8090
      - name: Production refuses a missing STUDIO_SECRET_KEY
        run: |
          if docker run --rm -e JWT_SECRET=ci-jwt-0123456789abcdef0123456789 superstep:ci python -c "import app.main"; then
            echo "started without STUDIO_SECRET_KEY" >&2; exit 1; fi
      - name: CLI install and upgrade smoke
        run: |
          python -m pip install -e sdk/python
          python scripts/cli_smoke.py
      - if: failure()
        run: docker logs sq || true; docker logs pg || true; docker logs rv || true; docker logs sbx || true; docker logs rm || true
      - name: Install verified Trivy from its pinned GitHub release
        shell: bash
        run: |
          trivy_dir="$RUNNER_TEMP/trivy-v0.69.3"
          mkdir -p "$trivy_dir"
          curl --fail --show-error --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz \
            --output "$trivy_dir/trivy.tar.gz"
          printf '%s  %s\n' 1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75 "$trivy_dir/trivy.tar.gz" | sha256sum --check
          tar -xzf "$trivy_dir/trivy.tar.gz" -C "$trivy_dir" trivy
          "$trivy_dir/trivy" --version
          echo "$trivy_dir" >> "$GITHUB_PATH"
      - name: Trivy (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0 (immutable; earlier tags were compromised in March 2026)
        with:
          version: v0.69.3
          skip-setup-trivy: true # Binary above is checksum-verified; both scans remain required.
          image-ref: superstep:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy, sandbox image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          skip-setup-trivy: true
          image-ref: superstep-sandbox:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  publish:
    name: Publish to GHCR (${{ matrix.image.suffix || 'app' }})
    needs: [source, test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { suffix: "", file: Dockerfile, context: ".", scope: "", title: "Superstep", description: "Visual LangGraph studio (all-in-one image)" }
          - { suffix: "-sandbox", file: docker/studio-sandbox/Dockerfile, context: ".", scope: sandbox, title: "Superstep sandbox", description: "Code node sandbox service for STUDIO_CODE_RUNTIME=remote" }
          - { suffix: "-api", file: backend/Dockerfile, context: backend, scope: api, title: "Superstep API", description: "API and worker image" }
          - { suffix: "-web", file: frontend/Dockerfile, context: ".", scope: web, title: "Superstep web", description: "Web UI image" }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - name: Bind git metadata to the verified source commit
        run: git switch --create image-source
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ghcr.io/${{ github.repository }}${{ matrix.image.suffix }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.source.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.source.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.source.outputs.tag }},enable=${{ !startsWith(needs.source.outputs.tag, 'v0.') }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.image.title }}
            org.opencontainers.image.description=${{ matrix.image.description }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha${{ matrix.image.scope && format(',scope={0}', matrix.image.scope) || '' }}
          provenance: true
