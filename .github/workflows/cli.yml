# CLI unit tests. Pull requests only. Publishing stays on tag workflows.
name: CLI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python CLI (pytest, Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install 'mcp>=1.12,<2'
      - run: python -m pytest -q
        env:
          SUPERSTEP_MCP_TEST: "1"
