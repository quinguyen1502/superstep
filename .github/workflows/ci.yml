name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, 'factory/task-*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install uv (used by repo-import tests)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - name: Install Deno (TypeScript Code nodes, TASK-0080)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  backend-postgres:
    name: Backend (pytest on Postgres 17 + Redis 7)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: studio, POSTGRES_PASSWORD: studio, POSTGRES_DB: studio }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U studio" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://studio:studio@localhost:5432/studio
      TEST_DATABASE_URL: postgresql://studio:studio@localhost:5432/studio
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  attachment-s3:
    name: Attachment storage on MinIO (s3 backend)
    runs-on: ubuntu-latest
    services:
      minio:  # S3-compatible storage for the s3 attachment backend's contract tests (TASK-0193, REQ-0080)
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env: { MINIO_ROOT_USER: minio-ci, MINIO_ROOT_PASSWORD: minio-ci-password, MINIO_DEFAULT_BUCKETS: superstep-ci }
        ports: ["9000:9000"]
        options: --health-cmd "curl -fs http://localhost:9000/minio/health/live" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      STUDIO_TEST_S3_ENDPOINT: http://localhost:9000
      STUDIO_TEST_S3_BUCKET: superstep-ci
      STUDIO_TEST_S3_ACCESS_KEY_ID: minio-ci
      STUDIO_TEST_S3_SECRET_ACCESS_KEY: minio-ci-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[s3]"
      - run: python -m pytest -q tests/test_attachment_store_s3.py tests/test_attachment_s3_multipart.py tests/test_attachment_storage.py tests/test_attachment_migration.py tests/test_chat_edits.py

  compose:
    name: docker compose build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: printf 'JWT_SECRET=ci-%s\nPOSTGRES_PASSWORD=ci-pass\n' "$GITHUB_RUN_ID" > .env
      - run: docker compose up -d --build --wait
      - run: pip install httpx websockets && python scripts/compose_smoke.py http://localhost:8080
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (npm build, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run lint
        working-directory: .
      - run: npm run build
        working-directory: .
      - run: npm test
        working-directory: .

  e2e:
    # The Playwright suite (en and vi) on every pull request and push (TASK-0199). Three shards keep each job near
    # five minutes; a shard starts its own backend, Vite, mock chat API and SMTP sink (playwright.config.ts).
    name: E2E (Playwright, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      E2E_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
      E2E_CODE_RUNTIME: subprocess  # Code-mode specs run without the sandbox images (uv + deno below)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install backend (backend/.venv, the path playwright.config.ts starts)
        working-directory: backend
        run: python -m venv .venv && .venv/bin/python -m pip install -e ".[dev]"
      - name: Install frontend
        working-directory: .
        run: npm ci
      - name: Playwright version (browser cache key)
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium
      - name: Run the suite
        working-directory: frontend
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  code-sandbox:
    name: Code sandbox images (Python + TypeScript on Docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: docker build -t studio-code:1 ../docker/studio-code && docker build -t studio-code-ts:1 ../docker/studio-code-ts
      - run: python -m pip install -e ".[dev]"
      - name: Docker-runtime Code tests (TASK-0053, TASK-0080)
        run: python -m pytest -q tests/test_code_node.py tests/test_code_typescript.py -rs

  sdk-python:
    name: Python SDK (pytest, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,chat]" build
      - run: python -m pytest -q
      - run: python -m build

  sdk-typescript:
    name: TypeScript SDK (vitest, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace=@superstep/sdk --include-workspace-root=false
        working-directory: .
      - name: Generated types match docs/api/openapi.public.json
        run: npm run gen:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && npm run test:package && npm pack --dry-run

  sdk-integration:
    name: SDKs against a live backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install backend and SDKs
        run: |
          python -m pip install -e "backend[dev]" -e "sdk/python[dev,chat]"
          npm ci --workspace=@superstep/sdk --include-workspace-root=false
      - name: Public spec is up to date
        run: python scripts/gen_public_openapi.py --check
      - run: scripts/sdk_integration.sh
        env:
          BACKEND_PYTHON: python
          SDK_PYTHON: python

  chat-host-e2e:
    name: Chat host e2e (two origins, React ${{ matrix.react }})
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install backend, UI and SDK build dependencies
        run: |
          python -m pip install -e "backend[dev]"
          npm ci
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Install isolated React 18 compatibility fixture
        if: matrix.react == 18
        run: |
          npm install --prefix "$RUNNER_TEMP/react18" --ignore-scripts --no-audit --no-fund react@18.3.1 react-dom@18.3.1
          echo "REACT_COMPAT_ROOT=$RUNNER_TEMP/react18" >> "$GITHUB_ENV"
      - name: Run local sample and cross-origin acceptance
        run: scripts/chat_host_e2e.sh
        env:
          BACKEND_PYTHON: python
      - name: Upload host screenshots (no auth traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-host-screenshots-react-${{ matrix.react }}
          path: |
            frontend/test-results/chat-host/
            frontend/test-results/react-chat/
            frontend/test-results/widget-chat/
          retention-days: 14
