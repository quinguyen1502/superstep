name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install uv (used by repo-import tests)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - name: Install Deno (TypeScript Code nodes, TASK-0080)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  backend-postgres:
    name: Backend (pytest on Postgres 17 + Redis 7)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: studio, POSTGRES_PASSWORD: studio, POSTGRES_DB: studio }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U studio" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://studio:studio@localhost:5432/studio
      TEST_DATABASE_URL: postgresql://studio:studio@localhost:5432/studio
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  compose:
    name: docker compose build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: printf 'JWT_SECRET=ci-%s\nPOSTGRES_PASSWORD=ci-pass\n' "$GITHUB_RUN_ID" > .env
      - run: docker compose up -d --build --wait
      - run: pip install httpx websockets && python scripts/compose_smoke.py http://localhost:8080
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (npm build, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  code-sandbox:
    name: Code sandbox images (Python + TypeScript on Docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: docker build -t studio-code:1 ../docker/studio-code && docker build -t studio-code-ts:1 ../docker/studio-code-ts
      - run: python -m pip install -e ".[dev]"
      - name: Docker-runtime Code tests (TASK-0053, TASK-0080)
        run: python -m pytest -q tests/test_code_node.py tests/test_code_typescript.py -rs

  sdk-python:
    name: Python SDK (pytest, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" build
      - run: python -m pytest -q
      - run: python -m build

  sdk-typescript:
    name: TypeScript SDK (vitest, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - name: Generated types match docs/api/openapi.public.json
        run: npm run gen:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && npm pack --dry-run

  sdk-integration:
    name: SDKs against a live backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install backend and SDKs
        run: |
          python -m pip install -e "backend[dev]" -e "sdk/python[dev]"
          npm ci --prefix sdk/typescript
      - name: Public spec is up to date
        run: python scripts/gen_public_openapi.py --check
      - run: scripts/sdk_integration.sh
        env:
          BACKEND_PYTHON: python
          SDK_PYTHON: python
