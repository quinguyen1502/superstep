name: Factory PR text

# Fails when the pull request title or body contains Vietnamese text; reruns when either is edited.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Factory CLI
        run: python -m pip install ./.factory
      - name: Check PR title and body
        run: factory pr check
